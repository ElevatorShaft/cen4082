name: Java Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
permissions:
  contents: read

jobs:
  build-image:

    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Record source revision
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          git log -1 --oneline

      - name: Build, test, and package
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-collection-jar
          path: target/*.jar
          if-no-files-found: error
          
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "game-collection:${IMAGE_TAG}" .
        
      - name: Export Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker save --output game-collection-image.tar \
            "game-collection:${IMAGE_TAG}"
            
      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: game-collection-image-${{ github.sha }}
          path: game-collection-image.tar
          if-no-files-found: error
